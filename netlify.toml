[build]
  # Configuración para que Netlify compile automáticamente con Hugo y genere el índice de búsqueda con Pagefind
  command = "npm run build"
  publish = "public"

[build.environment]
  # Versión exacta de Hugo Extendida para soportar procesamiento de temas (Dart-Sass)
  HUGO_VERSION = "0.124.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
